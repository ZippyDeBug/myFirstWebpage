<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles.css">
    
    <title>Document</title>
</head>
<body>
    <div class="calc-body">
        <div class="calc-screen">
        <p>0</p>
        </div>

        <div class="calc-functions">
            <button id="symClear">C</button>
            <button id="symClearAll">CE</button>        
        </div>

        <div class="calc-buttons">
            <div class="calc-numbers">
                <button id="no1">1</button>
                <button id="no2">2</button>
                <button id="no3">3</button>
                <button id="no4">4</button>
                <button id="no5">5</button>
                <button id="no6">6</button>
                <button id="no7">7</button>
                <button id="no8">8</button>
                <button id="no9">9</button>
                <button id="no0">0</button>
                <button id="no.">.</button>
                <button id="sym=">=</button>
                
            </div>

            <div class="calc-symbols">
            <button id="sym*">x</button>
            <button id="sym/">/</button>
            <button id="sym-">-</button>
            <button id="sym+">+</button>

            


            </div>
            
        </div>



    </div>
</body>
</html>
